name: Build CADpad firmware

on:
  push:
    paths:
      - 'Firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'Firmware/**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.keymap }} keymap
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - keymap: default
            source: Firmware/keymap.c
          - keymap: production
            source: Firmware/production/keymap.c

    steps:
      - name: Let git trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Check out CADpad
        uses: actions/checkout@v4
        with:
          path: cadpad

      - name: Check out QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Graft the cadpad keyboard into the QMK tree
        run: |
          set -eux
          dest=qmk_firmware/keyboards/cadpad
          mkdir -p "$dest/keymaps/${{ matrix.keymap }}"
          cp cadpad/Firmware/info.json "$dest/"
          cp cadpad/Firmware/rules.mk  "$dest/"
          cp "cadpad/${{ matrix.source }}" "$dest/keymaps/${{ matrix.keymap }}/keymap.c"

      - name: Point QMK at this checkout
        working-directory: qmk_firmware
        run: |
          set -eux
          qmk config user.qmk_home="$PWD"
          echo "QMK_HOME=$PWD" >> "$GITHUB_ENV"
          qmk config user.qmk_home
          ls -la keyboards/cadpad
          ls -la "keyboards/cadpad/keymaps/${{ matrix.keymap }}"

      - name: Compile
        id: compile
        working-directory: qmk_firmware
        run: |
          set -o pipefail
          make "cadpad:${{ matrix.keymap }}" 2>&1 | tee /tmp/compile.log

      - name: Surface compile errors as annotations
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "===== error lines ====="
          grep -niE "error|undefined|no such file|cannot|not found" /tmp/compile.log | head -40 || true
          echo "===== tail ====="
          tail -n 60 /tmp/compile.log || true
          body=$(grep -niE "error|undefined|no such file|cannot|not found" /tmp/compile.log | head -25)
          if [ -z "$body" ]; then body=$(tail -n 40 /tmp/compile.log); fi
          enc=$(printf "%s" "$body" | sed "s/%/%25/g" | tr -d "\015" | awk '{printf "%s%%0A", $0}')
          echo "::error title=QMK compile failed (${{ matrix.keymap }})::$enc"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cadpad-${{ matrix.keymap }}-uf2
          path: qmk_firmware/*.uf2
          if-no-files-found: error
